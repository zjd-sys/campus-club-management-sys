server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: campus-club-backend
  # 本地默认使用 H2 内存库即可直接启动；生产请激活 mysql profile：
  #   java -jar campus-club-backend.jar --spring.profiles.active=mysql
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# ============ JWT 配置（密钥从环境变量读取，默认值仅用于本地开发） ============
jwt:
  secret: ${JWT_SECRET:campus-club-default-dev-secret-please-change-in-prod-32bytes}
  expiration: 86400000   # 24h (ms)
  admin-secret: ${ADMIN_SECRET:admin123}

# ============ 文件存储：local 默认（可切换 minio） ============
storage:
  type: ${STORAGE_TYPE:local}
  local:
    path: ${STORAGE_LOCAL_PATH:./uploads}
    base-url: /files

# ============ 登录安全策略 ============
security:
  login:
    fail-lock-threshold: 5      # 连续失败次数达到即锁定
    lock-minutes: 10            # 锁定分钟数
    fail-delay-ms: 1000         # 登录失败后后端强制延时
    ip-limit-per-minute: 8      # 单IP每分钟最大登录次数
    captcha-trigger-fail: 3     # 同一账号失败达到该值启用验证码

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
